name: update-prices
on:
  schedule:
    # 6 descargas al dia (UTC). La subasta se publica ~12:45 hora de Europa central
    # (10:45 UTC en verano, 11:45 UTC en invierno): estas horas cubren ambas estaciones.
    - cron: "37 3 * * *"
    - cron: "52 10 * * *"
    - cron: "47 11 * * *"
    - cron: "37 12 * * *"
    - cron: "17 14 * * *"
    - cron: "7 21 * * *"
  workflow_dispatch:
concurrency:
  group: update-prices
  cancel-in-progress: false
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Download prices
        run: python scripts/fetch_prices.py site
      - name: Commit data
        run: |
          git config user.name "luz-prices-bot"
          git config user.email "luz-prices-bot@users.noreply.github.com"
          git add -A site
          git diff --cached --quiet || git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push || (git pull --rebase && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
      - name: Alert if tomorrow is missing
        run: python scripts/check_tomorrow.py site
